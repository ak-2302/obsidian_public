<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Saved image example</title>
  <desc id="desc">Example graphic stored in the repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#dce8ef"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#124c5f"/>
      <stop offset="100%" stop-color="#2f7a8b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" rx="48" fill="url(#bg)"/>
  <circle cx="960" cy="160" r="110" fill="#ffffff" opacity="0.55"/>
  <circle cx="220" cy="540" r="140" fill="#ffffff" opacity="0.32"/>
  <rect x="170" y="150" width="520" height="400" rx="36" fill="#ffffff" opacity="0.8"/>
  <rect x="220" y="210" width="420" height="18" rx="9" fill="#124c5f" opacity="0.55"/>
  <rect x="220" y="256" width="300" height="18" rx="9" fill="#124c5f" opacity="0.35"/>
  <rect x="220" y="330" width="420" height="14" rx="7" fill="#66707a" opacity="0.45"/>
  <rect x="220" y="364" width="380" height="14" rx="7" fill="#66707a" opacity="0.3"/>
  <rect x="220" y="398" width="340" height="14" rx="7" fill="#66707a" opacity="0.3"/>
  <rect x="220" y="460" width="160" height="52" rx="18" fill="url(#accent)"/>
  <text x="220" y="502" font-size="22" font-family="Inter, system-ui, sans-serif" fill="#ffffff">Saved</text>
  <text x="760" y="286" font-size="72" font-family="Inter, system-ui, sans-serif" font-weight="800" fill="#1f2328">Image</text>
  <text x="760" y="360" font-size="32" font-family="Inter, system-ui, sans-serif" fill="#66707a">stored in the repository</text>
</svg>
